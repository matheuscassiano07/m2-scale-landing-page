    <rect x="0" y="0" width="310" height="68" rx="18" fill="none" stroke="rgba(168,121,74,0.22)"/>
    <text x="16" y="24" font-size="12.5" font-weight="500" fill="#ffffff">Seu projeto está em etapa de</text>
    <text x="16" y="42" font-size="12.5" font-weight="500" fill="#ffffff">compatibilização. Previsão de entrega:</text>
    <text x="16" y="60" font-size="12.5" font-weight="600" fill="#D8C3A5">12/06.</text>
    <text x="16" y="64" font-size="9" fill="#ffffff" opacity="0.45">10:32</text>
  </g>

  <!-- Cliente: responsável -->
  <g transform="translate(108 324)">
    <rect x="0" y="0" width="262" height="44" rx="18" fill="url(#bubMe)"/>
    <rect x="0" y="0" width="262" height="44" rx="18" fill="none" stroke="rgba(120,200,160,0.12)"/>
    <text x="16" y="26" font-size="13" font-weight="500" fill="#ffffff">Quem é o responsável pela obra?</text>
    <text x="246" y="38" font-size="9" fill="#ffffff" opacity="0.55" text-anchor="end">10:33</text>
  </g>

  <!-- John AI: Eng. Lucas -->
  <g transform="translate(20 380)">
