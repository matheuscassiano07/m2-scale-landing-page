    <rect x="0" y="0" width="318" height="72" rx="18" fill="none" stroke="rgba(168,121,74,0.22)"/>
    <text x="16" y="24" font-size="12.5" font-weight="500" fill="#ffffff">O responsável técnico é o Eng. Lucas.</text>
    <text x="16" y="42" font-size="12.5" font-weight="500" fill="#ffffff">Posso conectar você com ele, se preferir.</text>
    <text x="16" y="66" font-size="9" fill="#ffffff" opacity="0.45">10:33</text>
  </g>

  <!-- Cliente: dificuldade em explicar -->
  <g transform="translate(52 464)">
    <rect x="0" y="0" width="318" height="58" rx="18" fill="url(#bubMe)"/>
    <rect x="0" y="0" width="318" height="58" rx="18" fill="none" stroke="rgba(120,200,160,0.12)"/>
    <text x="16" y="24" font-size="12.5" font-weight="500" fill="#ffffff">Não consigo explicar direito como eu</text>
    <text x="16" y="42" font-size="12.5" font-weight="500" fill="#ffffff">quero esse projeto...</text>
    <text x="302" y="52" font-size="9" fill="#ffffff" opacity="0.55" text-anchor="end">10:34</text>
  </g>

