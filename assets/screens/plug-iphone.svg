    <text x="16" y="20" font-size="12" fill="#ffffff" opacity="0.45">Mensagem</text>
  </g>
  <g transform="translate(346 776)">
    <circle cx="16" cy="16" r="16" fill="#A8794A"/>
    <path d="M11 11 L23 16 L11 21 L13 16 Z" fill="#ffffff"/>
