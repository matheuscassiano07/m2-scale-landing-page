<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="390" height="844" viewBox="0 0 390 844" role="presentation" font-family="-apple-system, 'SF Pro Display', 'Inter', system-ui, sans-serif">
  <defs>
    <linearGradient id="jBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e0e11"/>
      <stop offset="60%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="jHeader" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15151a"/>
      <stop offset="100%" stop-color="#0c0c10"/>
    </linearGradient>
    <linearGradient id="bubMe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f3a2a"/>
      <stop offset="100%" stop-color="#13261c"/>
    </linearGradient>
    <linearGradient id="bubBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d1d22"/>
      <stop offset="100%" stop-color="#15151a"/>
    </linearGradient>
    <clipPath id="avatarClip">
      <circle cx="78" cy="88" r="20"/>
    </clipPath>
    <clipPath id="avatarClipSm">
      <circle cx="29" cy="29" r="15"/>
    </clipPath>
  </defs>

  <rect width="390" height="844" fill="url(#jBg)"/>

  <g fill="#ffffff">
    <text x="32" y="34" font-size="15" font-weight="600">9:41</text>
    <g transform="translate(308 22)">
      <rect x="0" y="6" width="3" height="10" rx="1"/>
      <rect x="6" y="3" width="3" height="13" rx="1"/>
      <rect x="12" y="0" width="3" height="16" rx="1" opacity="0.85"/>
    </g>
    <g transform="translate(330 24)">
      <path d="M0 8 a8 8 0 0 1 16 0" stroke="#ffffff" stroke-width="1.6" fill="none" opacity="0.85"/>
      <path d="M3 8 a5 5 0 0 1 10 0" stroke="#ffffff" stroke-width="1.6" fill="none" opacity="0.6"/>
      <circle cx="8" cy="8" r="1.6"/>
    </g>
    <g transform="translate(352 24)">
      <rect x="0" y="2" width="22" height="11" rx="3" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.85"/>
