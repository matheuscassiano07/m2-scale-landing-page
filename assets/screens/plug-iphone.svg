  <image href="../avatar-john.png" x="58" y="68" width="40" height="40" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatarClip)"/>
  <circle cx="94" cy="102" r="5" fill="#0e0e11"/>
  <circle cx="94" cy="102" r="3.2" fill="#22c55e"/>

  <g transform="translate(110 80)" fill="#ffffff">
    <text x="0" y="14" font-size="16" font-weight="600" letter-spacing="-0.3">John AI</text>
