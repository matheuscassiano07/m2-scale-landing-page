  <g transform="translate(20 534)">
    <rect x="0" y="0" width="328" height="80" rx="18" fill="url(#bubBot)"/>
    <rect x="0" y="0" width="328" height="80" rx="18" fill="none" stroke="rgba(168,121,74,0.22)"/>
    <text x="16" y="22" font-size="12.5" font-weight="500" fill="#ffffff">Entendi. Posso fazer algumas perguntas</text>
    <text x="16" y="40" font-size="12.5" font-weight="500" fill="#ffffff">para entender e te apresentar as melhores</text>
    <text x="16" y="58" font-size="12.5" font-weight="500" fill="#ffffff">opções para você.</text>
    <text x="16" y="74" font-size="9" fill="#ffffff" opacity="0.45">10:34</text>
  </g>

  <g transform="translate(20 626)">
    <rect x="0" y="0" width="74" height="36" rx="18" fill="url(#bubBot)"/>
    <circle cx="22" cy="18" r="3" fill="#ffffff" opacity="0.55"/>
    <circle cx="36" cy="18" r="3" fill="#ffffff" opacity="0.75"/>
    <circle cx="50" cy="18" r="3" fill="#ffffff" opacity="0.95"/>
  </g>

  <g transform="translate(20 672)">
    <rect x="0" y="0" width="350" height="56" rx="14" fill="rgba(168,121,74,0.1)" stroke="rgba(168,121,74,0.22)"/>
    <g transform="translate(14 13)">
      <circle cx="15" cy="15" r="15" fill="#2a2218"/>
      <image href="../avatar-john.png" x="0" y="0" width="30" height="30" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatarClipSm)"/>
