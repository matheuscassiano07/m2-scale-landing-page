  </g>

  <!-- Cliente: status da obra -->
  <g transform="translate(148 188)">
    <rect x="0" y="0" width="222" height="44" rx="18" fill="url(#bubMe)"/>
    <rect x="0" y="0" width="222" height="44" rx="18" fill="none" stroke="rgba(120,200,160,0.12)"/>
    <text x="16" y="26" font-size="13" font-weight="500" fill="#ffffff">Qual o status da obra?</text>
    <text x="206" y="38" font-size="9" fill="#ffffff" opacity="0.55" text-anchor="end">10:32</text>
  </g>

  <!-- John AI: compatibilização + prazo -->
  <g transform="translate(20 244)">
