      <rect x="23" y="5" width="2" height="5" rx="1" fill="#ffffff" opacity="0.6"/>
    </g>
  </g>

  <rect x="0" y="56" width="390" height="76" fill="url(#jHeader)"/>
  <line x1="0" y1="132" x2="390" y2="132" stroke="rgba(255,255,255,0.06)"/>
  <g transform="translate(20 70)">
    <path d="M5 12 L0 17 L0 0 L18 0 L18 12 Z" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.7"/>
