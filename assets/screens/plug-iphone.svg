  <rect x="0" y="760" width="390" height="84" fill="#0a0a0c"/>
  <line x1="0" y1="760" x2="390" y2="760" stroke="rgba(255,255,255,0.06)"/>
  <g transform="translate(16 776)">
    <circle cx="16" cy="16" r="16" fill="rgba(255,255,255,0.06)"/>
    <path d="M16 8 L16 24 M8 16 L24 16" stroke="#ffffff" stroke-width="1.6" opacity="0.7"/>
